<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruitsList"></ul>
    <script>
        let fruits = ["Mango" , "Guava" , "Dragon Fruit"]
        
        let listItems = "";
        for (let i = 0; i < fruits.length;i++) {
            listItems = listItems + "<li>" + fruits[i] + "</li>"
    
        }

        document.getElementById("fruitsList").innerHTML = listItems
    </script>
</body>
</html>
